<!DOCTYPE html>
<html lang="fa">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>کافه آرامش</title>

    <style>

        body {
            font-family: Tahoma;
            direction: rtl;
            margin: 0;
            background-color:whitesmoke ;
            color: brown;
        }

        .welcome {
            text-align: center;
            padding: 80px 20px;
        }

        .welcome h1 {
            font-size: 45px;
            color: burlywood;
        }

        .welcome h2 {
            font-size: 22px;
            font-weight: normal;
        }

        .welcome p {
            font-size: 17px;
            line-height: 2;
        }

       

      
        .buttons {
            margin-top: 35px;
        }

        .buttons a {
            display: inline-block;
            background-color: brown;
            color: white;
            text-decoration: none;
            padding: 15px 35px;
            margin: 10px;
            border-radius: 8px;
            transition: 0.3s;
        }

        .buttons a:hover {
            background-color: burlywood;
        }

        footer {
            background-color: burlywood;
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: 50px;
        }

        @media (max-width: 600px) {

            .welcome h1 {
                font-size: 32px;
            }

            .buttons a {
                display: block;
                width: 70%;
                margin: 15px auto;
            }

        }

    </style>

</head>

<body>


    <section class="welcome">

        <p>
            به کافه آرامش خوش آمدید؛
            جایی برای نوشیدن یک قهوه خوب

        </p>


        


        <nav class="buttons">

            <a href="reservation.html">

            </a>

            </a>

        </nav>

    </section>


    <footer>

        <p>

        </p>
