<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رزرو میز | کافه آرامش</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site-header">
    <h1>رزرو میز</h1>
    <nav>
        <a href="index.html">خانه</a>
        <a href="menu.html">منو</a>
        <a href="tables.html">میزها</a>
        <a class="active" href="reservation.html">رزرو میز</a>
        <a href="my-reservations.html">رزروهای من</a>
    </nav>
</header>

<main class="section">
    <div class="form-wrapper">
        <h2 class="section-title">فرم رزرو</h2>
        <p class="hint">می‌توانید ابتدا از صفحه میزها یک میز را انتخاب کنید یا مستقیماً فرم زیر را تکمیل کنید.</p>

        <form id="reservationForm" novalidate>
            <div class="form-grid">
                <label>نام و نام خانوادگی
                    <input id="name" type="text" placeholder="مثلاً زهره احمدی">
                    <small class="error" id="nameError"></small>
                </label>

                <label>شماره تلفن
                    <input id="phone" type="tel" placeholder="09123456789">
                    <small class="error" id="phoneError"></small>
                </label>

                <label>تعداد نفرات
                    <input id="guests" type="number" min="1" max="20" placeholder="مثلاً 3">
                    <small class="error" id="guestsError"></small>
                </label>

                <label>انتخاب میز
                    <select id="tableSelect">
                        <option value="">انتخاب کنید</option>
                    </select>
                    <small class="error" id="tableError"></small>
                </label>

                <label>تاریخ
                    <input id="date" type="date">
                    <small class="error" id="dateError"></small>
                </label>

                <label>ساعت
                    <input id="time" type="time">
                    <small class="error" id="timeError"></small>
                </label>
            </div>

            <button class="btn submit-btn" type="submit">ثبت رزرو</button>
            <p id="formMessage" class="form-message"></p>
        </form>
    </div>
</main>

<footer>کافه آرامش | منتظر دیدار شما هستیم</footer>
<script src="script.js"></script>
</body>
</html>
