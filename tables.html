<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">

<main class="section">
    <h2 class="section-title">انتخاب میز</h2>
    <div class="filters">
        <label>ظرفیت:
            <select id="capacityFilter">
                <option value="all">همه</option>
                <option value="2">۲ نفره</option>
                <option value="4">۴ نفره</option>
                <option value="6">۶ نفره</option>
            </select>
        </label>
        <label>وضعیت:
            <select id="statusFilter">
                <option value="all">همه</option>
                <option value="available">آزاد</option>
                <option value="reserved">رزرو شده</option>
            </select>
        </label>
    </div>
    <div id="tablesContainer" class="table-grid"></div>

<footer>کافه آرامش | منتظر دیدار شما هستیم</footer>
